<!DOCTYPE html>
<html>
<head>
    <title>Enterprise Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
    <div class="max-w-6xl mx-auto py-10">
        <h1 class="text-3xl font-bold mb-8 text-slate-800">Task Analytics Dashboard</h1>
        
        <div class="grid grid-cols-3 gap-6 mb-10">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <p class="text-slate-500 text-sm font-medium uppercase">Efficiency Rate</p>
                <p class="text-4xl font-bold text-blue-600">{{ performance }}%</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <p class="text-slate-500 text-sm font-medium uppercase">Active Tasks</p>
                <p class="text-4xl font-bold text-slate-800">{{ pending }}</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <p class="text-slate-500 text-sm font-medium uppercase">Total Logged</p>
                <p class="text-4xl font-bold text-slate-800">{{ total }}</p>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-50 border-b border-slate-200">
                    <tr>
                        <th class="px-6 py-4 text-sm font-semibold text-slate-600">Task Name</th>
                        <th class="px-6 py-4 text-sm font-semibold text-slate-600">Status</th>
                    </tr>
                </thead>
                <tbody>
                    {% for task in tasks %}
                    <tr class="border-b border-slate-100 last:border-0">
                        <td class="px-6 py-4 text-slate-700">{{ task.title }}</td>
                        <td class="px-6 py-4">
                            {% if task.is_completed %}
                            <span class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs">Done</span>
                            {% else %}
                            <span class="px-3 py-1 bg-amber-100 text-amber-700 rounded-full text-xs">In Progress</span>
                            {% endif %}
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
